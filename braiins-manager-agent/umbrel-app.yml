    type: "three-stats"
    refresh: "10s"
    endpoint: "web:8080/widgets/status"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - icon: "plug-connected"
          text: "Running"
          subtext: "Agent"
        - icon: "cpu"
          text: "3"
          subtext: "Miners"
        - icon: "cloud-upload"
          text: "now"
          subtext: "Telemetry"

submitter: Braiins
submission: ""
