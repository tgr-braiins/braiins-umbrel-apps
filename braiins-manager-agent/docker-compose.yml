version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-manager-agent_web_1
      APP_PORT: 8080

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-manager-agent:4.12.0@sha256:8c1dc8a7319c5c1b88ad04946abc2b6900ca4ee0c922708b259ed4cefd6bb5ed
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # Shown in the app's web UI footer. Kept in sync with the manifest
      # `version` by bump.py (the agent daemon's own version is read from the
      # binary and is independent of this wrapper version).
      APP_VERSION: "4.12.0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
