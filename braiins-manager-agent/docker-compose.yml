version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-manager-agent_web_1
      APP_PORT: 8080

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-manager-agent:4.15.0@sha256:5f3aee9161486940ec7cb233ec824f8fbf614cca294420ff03a596ca6a6d9680
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # Shown in the app's web UI footer. Kept in sync with the manifest
      # `version` by bump.py (the agent daemon's own version is read from the
      # binary and is independent of this wrapper version).
      APP_VERSION: "4.15.0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
