version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-manager-agent_web_1
      APP_PORT: 8080

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-manager-agent:4.14.0@sha256:341667d13ae2f54a1816bd6b4258836b372be12e8b0bc8798a2f412ac2622946
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # Shown in the app's web UI footer. Kept in sync with the manifest
      # `version` by bump.py (the agent daemon's own version is read from the
      # binary and is independent of this wrapper version).
      APP_VERSION: "4.14.0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
