version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-toolbox_web_1
      APP_PORT: 8888

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-toolbox:26.08.1@sha256:6baed46ebcd703f483f08a56cb703998f03f8d11a58f32d069bbf197c64eb87a
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
