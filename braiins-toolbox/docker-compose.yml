version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-toolbox_web_1
      APP_PORT: 8888

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-toolbox:26.09@sha256:da7f2a10afc791a79f188eeffe1b88488f69ed6861be2cc67a37a6c411279a16
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
