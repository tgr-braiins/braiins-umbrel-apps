version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-toolbox_web_1
      APP_PORT: 8888

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-toolbox:26.09@sha256:dc8145bb5214ab4c71a2e4cdc57da0ddb2d5972690d24ae106502b5b15c083bb
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
