version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-toolbox_web_1
      APP_PORT: 8888

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-toolbox:26.08.1@sha256:255a854b47ff3ba9f45b4fad693e223a4998c85ca825575aed75ab17b2509f52
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
