version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-toolbox_web_1
      APP_PORT: 8888

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-toolbox:26.09@sha256:1078563af99031b57c9893fde75b7a4e215bcf7a2a783e92ed02b666b2316a2f
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
