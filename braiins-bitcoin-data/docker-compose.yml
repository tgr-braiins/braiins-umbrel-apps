version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-bitcoin-data_web_1
      APP_PORT: 8080

  web:
    # TODO: move to a Braiins-owned registry before official-store submission.
    # The tag@digest is written by bump.py `pin` after the release workflow
    # pushes the multi-arch image (see .github/workflows/braiins-bitcoin-data-release.yml).
    image: ghcr.io/tgr-braiins/braiins-bitcoin-data:1.2.0@sha256:85b43d1279f37a6de4dea2b49559604f2a681c9d4684e96fd02bf0bc0f04c8e0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # Shown in the app's web UI footer. Kept in sync with the manifest
      # `version` by bump.py.
      APP_VERSION: "1.2.0"
      # Exported by the official bitcoin app for dependent apps.
      BITCOIN_RPC_HOST: $APP_BITCOIN_NODE_IP
      BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
    volumes:
      - ${APP_DATA_DIR}/data:/data
