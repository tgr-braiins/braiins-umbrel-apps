manifestVersion: 1
id: braiins-proxy
category: bitcoin
name: Braiins Proxy
version: "0.1.1"
tagline: Connect all your miners to the pool through your Umbrel
description: >-
  Braiins Proxy connects the miners at your site to Braiins Pool, or any
  other pool, through one program on your Umbrel. Point your miners at your
  Umbrel and Braiins Proxy forwards their work to the pool over encrypted
  Stratum V2, keeps backup pools ready, and switches to them within seconds
  when a pool goes down.


  The web interface shows your miners, their hashrate and the state of every
  pool, keeps a history of the hashrate, and lets you change the pools without
  editing files. Prometheus metrics are available at /metrics.


  To get started, open the app, enter your Braiins Pool username under Pools
  and save. Then set the pool URL of your miners to
  stratum+tcp://<your-umbrel-ip>:3333.


  Braiins Proxy updates through the Umbrel App Store. Its own update command
  and web interface password are for installs outside Umbrel and are not
  used here.
releaseNotes: |-
  First version of Braiins Proxy on Umbrel (Braiins Proxy 0.1.1).

  - Point your miners at your Umbrel on port 3333; the proxy connects them to Braiins Pool over encrypted Stratum V2, with backup pools ready.
  - The web interface shows your miners, their hashrate and the pools, and lets you change the pools.
  - Updates arrive through the Umbrel App Store.

