# Manual release of this app without a new upstream version (changes to
# this repo's code, compose, manifest or docs). Start it from the Actions
# tab. With a version, existing installs get the Update badge; with an empty
# version, the image is rebuilt and re-pinned at the current version, which
# reaches new installs only. Version schemes: DECISIONS.md.

name: braiins-bitcoin-data-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.14.0). Empty = re-pin the digest at the current version (new installs only, no Update badge)."
        required: false
        default: ""
      release_notes:
        description: "Release notes (Markdown), used when a version is given. Shown in the app and added to CHANGELOG-braiins-bitcoin-data.md."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-braiins-bitcoin-data
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write      # signs the build attestation (Sigstore)
      attestations: write
    uses: ./.github/workflows/_release.yml
    with:
      app: braiins-bitcoin-data
      app_id: braiins-bitcoin-data
      display: Bitcoin Data
      mode: release
      version: ${{ inputs.version }}
      notes: ${{ inputs.release_notes }}
      branch_prefix: braiins-bitcoin-data-release
      title_prefix: Bitcoin Data release
