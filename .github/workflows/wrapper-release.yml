# Manual release of this app without a new upstream version (changes to
# this repo's code, compose, manifest or docs). Start it from the Actions
# tab. With a version, existing installs get the Update badge; with an empty
# version, the image is rebuilt and re-pinned at the current version, which
# reaches new installs only. Version schemes: DECISIONS.md.

name: wrapper-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 4.15.1-1). Empty = re-pin the digest at the current version (new installs only, no Update badge)."
        required: false
        default: ""
      release_notes:
        description: "Release notes (Markdown), used when a version is given. Shown in the app and added to CHANGELOG-braiins-manager-agent.md."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-braiins-manager-agent
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: ./.github/workflows/_release.yml
    with:
      app: agent
      app_id: braiins-manager-agent
      display: Braiins Manager Agent
      mode: release
      version: ${{ inputs.version }}
      notes: ${{ inputs.release_notes }}
      branch_prefix: wrapper-release
      title_prefix: Wrapper release
