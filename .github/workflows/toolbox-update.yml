# Daily check of the public Braiins Toolbox release feed. When a new version
# ships, _release.yml builds it and opens a bump PR for a maintainer to merge.
# repository_dispatch (type toolbox-release) is there for a future push from
# the Toolbox release pipeline instead of polling.

name: toolbox-update

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [toolbox-release]

permissions:
  contents: read

concurrency:
  group: release-braiins-toolbox
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: ./.github/workflows/_release.yml
    with:
      app: toolbox
      app_id: braiins-toolbox
      display: Braiins Toolbox
      mode: check
      branch_prefix: toolbox-update
      title_prefix: Braiins Toolbox
