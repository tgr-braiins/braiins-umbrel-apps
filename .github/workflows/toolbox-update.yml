# Watches the public Braiins Toolbox release feed and opens a bump PR when a
# new version ships. Toolbox twin of agent-update.yml — same shape, same
# review gate: a maintainer merges the PR, nothing ships without a human click.
#
# Trigger paths:
#   - schedule: daily poll of downloads.braiins.com (offset from agent-update)
#   - workflow_dispatch: manual run from the Actions tab (for testing)
#   - repository_dispatch (type toolbox-release): for a future push-based
#     hookup from the Toolbox release pipeline (event-driven instead of polling)

name: toolbox-update

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [toolbox-release]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      REGISTRY_OWNER: ${{ github.repository_owner }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/braiins-toolbox
    steps:
      - uses: actions/checkout@v4

      - name: Check release feed, bump files if newer
        id: bump
        run: python3 .github/scripts/bump.py check --app toolbox

      - name: Set up QEMU (arm64)
        if: steps.bump.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up buildx
        if: steps.bump.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: steps.bump.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        if: steps.bump.outputs.changed == 'true'
        run: docker buildx build --platform linux/amd64 --provenance=false --load --tag smoke-test:local image-braiins-toolbox/

      - name: Smoke test
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -eux
          docker run --rm --user 1000:1000 smoke-test:local --version | grep -F "braiins-toolbox ${{ steps.bump.outputs.version }}"
          docker run -d --name smoke -p 18888:8888 --user 1000:1000 --init smoke-test:local
          sleep 5
          curl -fs http://localhost:18888/ | grep -F '<title>Braiins Toolbox</title>'
          docker logs smoke 2>&1 | grep -F 'server listening'
          docker rm -f smoke

      - name: Build and push multi-arch image
        if: steps.bump.outputs.changed == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --tag "$IMAGE:${{ steps.bump.outputs.version }}" \
            --push image-braiins-toolbox/

      - name: Pin multi-arch index digest in compose
        if: steps.bump.outputs.changed == 'true'
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.bump.outputs.version }}" --format '{{json .Manifest}}' | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          python3 .github/scripts/bump.py pin --app toolbox --version "${{ steps.bump.outputs.version }}" --digest "$digest"

      - name: Open bump PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: toolbox-update/${{ steps.bump.outputs.version }}
          commit-message: "Braiins Toolbox ${{ steps.bump.outputs.version }}"
          title: "Braiins Toolbox ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump from the public release feed
            (https://downloads.braiins.com/braiins-toolbox/index.json).

            Done by this workflow before opening the PR:
            - Dockerfile bumped to ${{ steps.bump.outputs.version }} with feed checksums
            - amd64 image smoke-tested (binary version, GUI serves and logs listening)
            - multi-arch image pushed to `${{ env.IMAGE }}:${{ steps.bump.outputs.version }}`
            - compose pinned to the multi-arch index digest
            - manifest version + releaseNotes updated from the feed
            - CHANGELOG-braiins-toolbox.md entry prepended for this version

            Review checklist before merging:
            - [ ] releaseNotes text reads sanely (it is taken verbatim from the feed)
            - [ ] CHANGELOG-braiins-toolbox.md entry reads sanely
            - [ ] update an Umbrel from this branch's store and verify the Device List still scans
          delete-branch: true
