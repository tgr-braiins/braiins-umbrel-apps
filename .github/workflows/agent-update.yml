# Daily check of the public Braiins Manager Agent release feed. When a new
# version ships, _release.yml builds it and opens a bump PR for a maintainer
# to merge. repository_dispatch (type agent-release) is there for a future
# push from the agent release pipeline instead of polling.

name: agent-update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [agent-release]

permissions:
  contents: read

concurrency:
  group: release-braiins-manager-agent
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
      actions: write
    uses: ./.github/workflows/_release.yml
    with:
      app: agent
      app_id: braiins-manager-agent
      display: Braiins Manager Agent
      mode: check
      branch_prefix: agent-update
      title_prefix: Braiins Manager Agent
