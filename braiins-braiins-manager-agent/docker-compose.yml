version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: braiins-braiins-manager-agent_web_1
      APP_PORT: 8080

  web:
    # TODO: move to a Braiins-owned registry before official-store submission
    image: ghcr.io/tgr-braiins/braiins-manager-agent:4.11.1-4@sha256:9a2a9282548c90c3dc37bcb6c8d9ed3209d9fc2a4ee04a9ee9da739c1b932cbd
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # Shown in the app's web UI footer. Kept in sync with the manifest
      # `version` by bump.py (the agent daemon's own version is read from the
      # binary and is independent of this wrapper version).
      APP_VERSION: "4.11.1-4"
    volumes:
      - ${APP_DATA_DIR}/data:/data
